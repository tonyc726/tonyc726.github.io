{{ if and .IsPage (ne .Params.comment false) -}}

  <!-- giscus (https://giscus.app)，基于 GitHub Discussions -->
  {{- with .Site.Params.giscus -}}
    {{- if and .enable .repoId .categoryId -}}
  <div class="post-comments">
    <script src="https://giscus.app/client.js"
            data-repo="{{ .repo }}"
            data-repo-id="{{ .repoId }}"
            data-category="{{ .category }}"
            data-category-id="{{ .categoryId }}"
            data-mapping="{{ .mapping }}"
            data-strict="0"
            data-reactions-enabled="{{ if .reactionsEnabled }}1{{ else }}0{{ end }}"
            data-emit-metadata="{{ if .emitMetadata }}1{{ else }}0{{ end }}"
            data-input-position="{{ .inputPosition }}"
            data-theme="preferred_color_scheme"
            data-lang="{{ .lang }}"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
  </div>
    {{- else if .enable -}}
  <!-- giscus 已启用但缺少 repoId / categoryId：请访问 https://giscus.app 生成后填入 config.toml 的 [params.giscus] -->
    {{- end -}}
  {{- end -}}

{{- end }}
